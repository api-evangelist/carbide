aid: carbide
name: Carbide
description: >-
  Carbide (carbidesecure.com) is a compliance-automation and risk-management
  platform that pairs software with credentialed security advisors to help
  fast-growing organizations achieve and maintain security certifications and
  regulatory compliance. The platform automates evidence collection, maps
  controls across frameworks, tracks remediation tasks, surfaces compliance
  gaps, and continuously monitors cloud and business-tool integrations. Carbide
  supports SOC 2, ISO 27001, HIPAA, CMMC, CPCSC, GDPR, CCPA, NIST 800-53, NIST
  800-171, PCI DSS, PIPEDA, and custom frameworks, and offers penetration
  testing and a customer-facing Trust Center product. Carbide is a Techstars
  portfolio company.
